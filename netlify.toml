[build]
  publish = "."
  command = "echo 'Static assets ready'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "ALLOWALL"
    Access-Control-Allow-Origin = "*"

[[redirects]]
  from = "/api/*"
  to = "https://paragraph-physicians-diamond-eclipse.trycloudflare.com/api/:splat"
  status = 200
  force = true
